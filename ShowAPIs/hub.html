<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub de APIs</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 40px;
        }

        .menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .1);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, .15);
        }

        .card h2 {
            margin-top: 0;
            color: #34495e;
        }

        .card p {
            color: #666;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            text-decoration: none;
            background-color: #3498db;
            color: white;
            border-radius: 5px;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: #2980b9;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            color: #777;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>SHOW DE APIs</h1>

        <div class="menu">



            <div class="card">
                <h2>Atividade API</h2>
                <p>Proposta - Desafio.</p>

                <a href="AtividadeAPI.html" class="btn">
                    Acessar
                </a>
            </div>

            <div class="card">
                <h2>APIs</h2>
                <p>Documentação e testes das APIs disponíveis.</p>

                <a href="APIS.html" class="btn">
                    Acessar
                </a>
            </div>


        </div>

        <footer>
            Desenvolvido por Max Vallim • Integração de Dados
        </footer>

    </div>

</body>

</html>
